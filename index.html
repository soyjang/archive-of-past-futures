<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Past Futures of the Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">

<div class="wrap">
  <header>
    <div class="eyebrow">Working prototype<span id="data-date"></span></div>
    <h1>Historicising Speculative Design</h1>
    <nav class="sitenav" aria-label="Pages">
      <a href="#intro" data-page="overview">Introduction</a>
      <a href="#codebook" data-page="codebook">Codebook</a>
      <a href="#book" data-page="book">Case 1 · Past futures of the book</a>
    </nav>
  </header>

  <div id="pages"></div>

</div>

<div class="tip" id="tip" hidden></div>

<script>
  // Each page is a file in pages/. They are loaded in this order, then js/app.js runs.
  const PAGE_FILES = ["intro", "book-header", "book-wheel", "book-corpus", "codebook"];
  Promise.all(PAGE_FILES.map(p => fetch("pages/" + p + ".html").then(r => { if (!r.ok) throw new Error("pages/" + p + ".html"); return r.text(); })))
    .then(parts => {
      document.getElementById("pages").innerHTML = parts.join("\n");
      const s = document.createElement("script"); s.src = "js/app.js"; document.body.appendChild(s);
    })
    .catch(e => {
      document.getElementById("pages").innerHTML = '<p class="small">Could not load ' + e.message + '. Serve this folder (for example with <code>python3 -m http.server</code>) rather than opening the file directly.</p>';
    });
</script>
